<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Explosion 💥</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 5px 0;
            user-select: none;
            touch-action: none;
            overflow: hidden;
            background-color: transparent;
            box-sizing: border-box;
        }

        #bg-menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('hintergrund.jpeg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        #bg-game {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('spiel-hintergrund.jpeg');
            background-size: cover;
            background-position: center;
            z-index: -2;
            display: none;
        }

        h1 {
            color: #ff5722;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            text-align: center;
        }

        /* --- HAUPTMENÜ --- */
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(6px);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 380px;
            border: 2px solid rgba(255,255,255,0.15);
            z-index: 10;
            margin: auto;
        }

        .btn {
            background-color: #00bcd4;
            color: #1a1a1a;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:active { transform: scale(0.95); }

        #music-btn { background-color: #444; color: white; border: 2px solid #666; }
        #music-btn.active { background-color: #4caf50; border-color: #66bb6a; color: white; }

        #leaderboard-container {
            margin-top: 10px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 8px;
        }

        #leaderboard-container h2 {
            color: #ffd700;
            text-align: center;
            margin: 0 0 5px 0;
            font-size: 16px;
            border-bottom: 1px solid #555;
            padding-bottom: 4px;
        }

        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .leaderboard-entry .rank { color: #aaa; width: 25px; }
        .leaderboard-entry .name { font-weight: bold; flex-grow: 1; text-align: left; }
        .leaderboard-entry .score { color: #00bcd4; font-weight: bold; }

        /* --- SPIELBEREICH --- */
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 4px 0;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95%;
            max-width: 380px;
            padding: 0 5px;
        }

        .scores {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            font-weight: bold;
        }
        #score-board { color: white; }
        #highscore-board { color: #ffd700; }

        #preview-area {
            background-color: rgba(42, 42, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #preview-area h3 { margin: 0; color: #aaa; font-size: 9px; text-transform: uppercase; writing-mode: vertical-lr; text-orientation: mixed; }
        #preview-container { display: flex; gap: 6px; align-items: center; }

        #double-score-banner {
            display: none;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        #powerup-bar {
            display: flex;
            gap: 10px;
            height: 26px;
            align-items: center;
        }

        #hammer-btn {
            background-color: #ff9800;
            color: #1a1a1a;
            border: none;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 4px;
        }
        #hammer-btn.active-hammer { background-color: #ff5722; color: white; outline: 2px solid white; }

        .board-wrapper { position: relative; display: flex; justify-content: center; margin: auto 0; }

        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 3px); }
            40% { transform: translate(4px, -3px); }
            100% { transform: translate(0, 0); }
        }
        .shake { animation: screenShake 0.3s ease-in-out; }

        #game-board {
            display: grid;
            grid-template-columns: repeat(8, 38px);
            grid-template-rows: repeat(8, 38px);
            gap: 2px;
            background-color: rgba(30, 30, 30, 0.85);
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
        }

        @media (min-height: 750px) {
            #game-board {
                grid-template-columns: repeat(8, 42px);
                grid-template-rows: repeat(8, 42px);
            }
        }

        .cell {
            background-color: rgba(60, 60, 60, 0.7);
            border-radius: 3px;
            transition: background-color 0.15s;
        }
        
        .cell.filled-color-0 { background-color: #ff5252; }
        .cell.filled-color-1 { background-color: #ffeb3b; }
        .cell.filled-color-2 { background-color: #00bcd4; }
        .cell.filled-color-3 { background-color: #ab47bc; }
        .cell.filled-color-4 { background-color: #66bb6a; }
        .cell.filled-color-5 { background-color: #ff9800; }
        .cell.filled-color-6 { background-color: #26c6da; }

        .cell.hover { background-color: #666 !important; }
        .cell.hammer-target { cursor: pointer; border: 2px dashed #ff5722; }
        .cell.clear-preview { background-color: #ff9800 !important; }
        .cell.explosion { background-color: #ffffff !important; transform: scale(1.1); }

        .floating-text {
            position: absolute;
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 6px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-35px) scale(1.2); opacity: 0; }
        }

        /* --- GAME OVER MODAL --- */
        #game-over-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 100;
            padding: 15px;
            text-align: center;
        }

        #game-over-modal h2 { color: #ff5722; font-size: 24px; margin: 0 0 5px 0; }
        #final-score { color: #00bcd4; font-size: 20px; font-weight: bold; }

        #new-highscore-area {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 8px;
        }
        
        #new-highscore-area p { color: #ffd700; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        
        #player-name-input {
            padding: 5px;
            font-size: 13px;
            border-radius: 4px;
            border: 2px solid #00bcd4;
            background-color: #222;
            color: white;
            text-align: center;
            margin-bottom: 5px;
            width: 140px;
        }

        .modal-buttons { display: flex; gap: 8px; margin-top: 8px; }

        /* --- SHAPE CONTAINER --- */
        #shape-container {
            display: flex;
            gap: 15px;
            height: 90px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .shape { display: grid; gap: 2px; cursor: grab; touch-action: none; }
        .shape-cell { border-radius: 2px; pointer-events: none; }
        .shape-cell.main { width: 26px; height: 26px; }
        .shape-cell.preview { width: 10px; height: 10px; }
        .shape-cell.empty { background-color: transparent !important; }

        #drag-ghost {
            position: fixed;
            pointer-events: none;
            display: none;
            z-index: 1000;
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div id="bg-menu"></div>
    <div id="bg-game"></div>

    <!-- HAUPTMENÜ -->
    <div id="main-menu">
        <h1>Block Explosion 💥</h1>
        <button class="btn" onclick="openGame()">Spiel Starten</button>
        <div id="gem-display" style="color: #00bcd4; font-weight: bold; margin-top: 8px; font-size: 15px;">💎 Juwelen: <span id="gem-count">0</span></div>
        <button id="music-btn" class="btn" onclick="toggleMusic()">Musik: AUS</button>
        <button class="btn" onclick="openShop()" style="background-color: #ff9800; color: #1a1a1a;">💎 Juwelen-Shop</button>
        <button class="btn" onclick="giveGems(1000)" style="background-color: #e91e63; color: white; font-size: 12px; padding: 5px; margin-top: 6px;">🛠️ Dev: +1.000 Juwelen</button>
        
        <div id="leaderboard-container">
            <h2>🏆 Top 5 Spieler</h2>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <!-- SPIEL BEREICH -->
    <div id="game-container">
        <div class="top-bar">
            <div class="scores">
                <div id="score-board">Punkte: <span id="score">0</span></div>
                <div id="highscore-board">Rekord: <span id="top-score">0</span></div>
            </div>

            <div id="preview-area">
                <h3>Nächste</h3>
                <div id="preview-container"></div>
            </div>
        </div>

        <div id="double-score-banner">⚡ 2x PUNKTE AKTIV! (<span id="timer-seconds">60</span>s)</div>

        <div id="powerup-bar">
            <button id="hammer-btn" onclick="activateHammer()">🔨 Hammer (<span id="hammer-count">0</span>)</button>
            <button id="undo-btn" onclick="undoMove()" style="background-color: #03a9f4; color: white; border: none; padding: 3px 8px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; display: none; align-items: center; gap: 4px;">↩️ Rückgängig</button>
        </div>
        
        <div class="board-wrapper" id="board-wrapper">
            <div id="game-board"></div>
            
            <div id="game-over-modal">
                <h2>Game Over!</h2>
                <p style="margin:5px 0;">Erreichte Punkte: <br><span id="final-score">0</span></p>
                
                <div id="new-highscore-area">
                    <p>🎉 NEUER HIGHSCORE! 🎉</p>
                    <input type="text" id="player-name-input" placeholder="Dein Name" maxlength="12">
                    <button class="btn" onclick="saveHighscore()" style="padding:6px;">Speichern</button>
                </div>

                <div id="standard-gameover-buttons" class="modal-buttons">
                    <button class="btn" onclick="restartGame()" style="padding:6px;">Neustart</button>
                    <button class="btn" onclick="backToMenu()" style="background-color: #666; padding:6px;">Menü</button>
                </div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <button class="btn" onclick="backToMenu()" style="width: auto; padding: 3px 12px; background-color: #444; font-size: 11px; margin-bottom: 2px;">Zum Hauptmenü</button>
            <div id="shape-container"></div>
        </div>
    </div>

    <div id="drag-ghost"></div>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const gameContainer = document.getElementById('game-container');
        const bgMenu = document.getElementById('bg-menu');
        const bgGame = document.getElementById('bg-game');
        const board = document.getElementById('game-board');
        const boardWrapper = document.getElementById('board-wrapper');
        const shapeContainer = document.getElementById('shape-container');
        const previewContainer = document.getElementById('preview-container');
        const scoreElement = document.getElementById('score');
        const topScoreElement = document.getElementById('top-score');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreElement = document.getElementById('final-score');
        const newHighscoreArea = document.getElementById('new-highscore-area');
        const standardButtons = document.getElementById('standard-gameover-buttons');
        const playerNameInput = document.getElementById('player-name-input');
        const leaderboardList = document.getElementById('leaderboard-list');
        const dragGhost = document.getElementById('drag-ghost');
        const musicBtn = document.getElementById('music-btn');
        const hammerBtn = document.getElementById('hammer-btn');
        const hammerCountElement = document.getElementById('hammer-count');
        const doubleScoreBanner = document.getElementById('double-score-banner');
        const timerSecondsElement = document.getElementById('timer-seconds');

        let score = 0;
        let grid = Array(8).fill().map(() => Array(8).fill(0));
        let moveHistory = [];
        let gridColors = Array(8).fill().map(() => Array(8).fill(-1));
        
        let blocksUsed = 0;
        let currentShapes = [];
        let nextShapes = [];

        let activeShapeIndex = null;
        let activePointerId = null;
        
        let ghostCellSize = 0;
        let grabOffsetRow = 0;
        let grabOffsetCol = 0;

        let hammersAvailable = 0;
        let hammerModeActive = false;

        let doubleScoreActive = false;
        let doubleScoreTimer = null;
        let secondsLeft = 60;
        
        let gems = parseInt(localStorage.getItem('blockExplosionGems')) || 0;
        let activeTheme = localStorage.getItem('blockExplosionTheme') || 'standard';
        let unlockedThemes = JSON.parse(localStorage.getItem('blockExplosionUnlocked')) || ['standard'];

        const themes = {
            standard: { name: "Standard Neon", price: 0, colors: ["#ff5252", "#ffeb3b", "#00bcd4", "#ab47bc", "#66bb6a", "#ff9800", "#26c6da"] },
            neon: { name: "Cyberpunk Neon ⚡", price: 500, colors: ["#ff0055", "#00ffcc", "#ffff00", "#ff00ff", "#00ff00", "#ff6600", "#00ffff"] },
            pastel: { name: "Pastel Traum 🌸", price: 1000, colors: ["#ffb3ba", "#ffdfba", "#ffffba", "#baffc9", "#bae1ff", "#e8baff", "#ffbae4"] },
            gold: { name: "Gold & Luxus 👑", price: 5000, colors: ["#d4af37", "#ffd700", "#b8860b", "#daa520", "#eee8aa", "#f0e68c", "#bdb76b"] }
        };

        function updateGemUI() {
            document.getElementById('gem-count').innerText = gems;
            const shopGemCount = document.getElementById('shop-gem-count');
            if (shopGemCount) shopGemCount.innerText = gems;
            localStorage.setItem('blockExplosionGems', gems);
        }

        function openShop() {
            updateGemUI();
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';
            for (let key in themes) {
                let theme = themes[key];
                let isUnlocked = unlockedThemes.includes(key);
                let isActive = activeTheme === key;
                
                let div = document.createElement('div');
                div.style.background = 'rgba(255,255,255,0.05)';
                div.style.padding = '8px';
                div.style.borderRadius = '6px';
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                div.style.border = isActive ? '2px solid #00bcd4' : '1px solid rgba(255,255,255,0.1)';
                
                let textDiv = document.createElement('div');
                textDiv.innerHTML = `<strong style="color:white; font-size:13px;">${theme.name}</strong><br><span style="color:#aaa; font-size:11px;">${isUnlocked ? (isActive ? 'Aktiv' : 'Freigeschaltet') : 'Kosten: ' + theme.price + ' 💎'}</span>`;
                
                let actionBtn = document.createElement('button');
                actionBtn.className = 'btn';
                actionBtn.style.width = 'auto';
                actionBtn.style.padding = '4px 8px';
                actionBtn.style.margin = '0';
                actionBtn.style.fontSize = '12px';
                
                if (isActive) {
                    actionBtn.innerText = 'Aktiv'; actionBtn.disabled = true; actionBtn.style.backgroundColor = '#444';
                } else if (isUnlocked) {
                    actionBtn.innerText = 'Wählen'; actionBtn.style.backgroundColor = '#00bcd4'; actionBtn.onclick = () => selectTheme(key);
                } else {
                    actionBtn.innerText = 'Kaufen'; actionBtn.style.backgroundColor = gems >= theme.price ? '#ff9800' : '#444'; actionBtn.onclick = () => buyTheme(key);
                }
                div.appendChild(textDiv); div.appendChild(actionBtn);
                container.appendChild(div);
            }
            document.getElementById('shop-modal').style.display = 'flex';
        }

        function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
        function buyTheme(key) {
            let theme = themes[key];
            if (gems >= theme.price) {
                gems -= theme.price; unlockedThemes.push(key);
                localStorage.setItem('blockExplosionUnlocked', JSON.stringify(unlockedThemes));
                selectTheme(key); openShop();
            } else { alert("Nicht genug Juwelen!"); }
        }
        function selectTheme(key) { activeTheme = key; localStorage.setItem('blockExplosionTheme', activeTheme); openShop(); }
        function getCurrentColors() { return themes[activeTheme].colors; }

        const bgMusic = new Audio('hintergrundmusik.mp3');
        bgMusic.loop = true;
        let musicEnabled = false;

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            if (musicEnabled) {
                musicBtn.innerText = "Musik: AN"; musicBtn.classList.add('active');
                bgMusic.play().catch(e => console.log(e));
            } else {
                musicBtn.innerText = "Musik: AUS"; musicBtn.classList.remove('active');
                bgMusic.pause();
            }
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            if (type === 'place') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'explode') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now); osc.frequency.exponentialRampToValueAtTime(50, now + 1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 1);
                osc.start(now); osc.stop(now + 1);
            } else if (type === 'hammer') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square'; osc.frequency.setValueAtTime(80, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'tableclear') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2); osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        const MAX_HIGHSCORES = 5;
        let leaderboards = JSON.parse(localStorage.getItem('blockExplosionLeaderboard')) || [];

        function updateLeaderboardUI() {
            leaderboardList.innerHTML = '';
            if (leaderboards.length === 0) {
                leaderboardList.innerHTML = '<div style="text-align:center; color:#888; font-size:11px;">Noch keine Einträge.</div>';
            } else {
                leaderboards.forEach((entry, index) => {
                    const div = document.createElement('div');
                    div.classList.add('leaderboard-entry');
                    div.innerHTML = `<span class="rank">#${index + 1}</span><span class="name">${entry.name}</span><span class="score">${entry.score}</span>`;
                    leaderboardList.appendChild(div);
                });
            }
            topScoreElement.innerText = leaderboards.length > 0 ? leaderboards[0].score : 0;
        }

        function isNewHighscore(scoreToCheck) {
            if (scoreToCheck === 0) return false;
            if (leaderboards.length < MAX_HIGHSCORES) return true;
            return scoreToCheck > leaderboards[leaderboards.length - 1].score;
        }

        const allShapes = [
            { matrix: [[1, 1], [1, 1]], colorId: 0 },
            { matrix: [[1, 1, 1]], colorId: 1 },
            { matrix: [[1], [1], [1]], colorId: 1 },
            { matrix: [[1, 1, 1, 1]], colorId: 2 },
            { matrix: [[1], [1], [1], [1]], colorId: 2 },
            { matrix: [[1, 0], [1, 0], [1, 1]], colorId: 3 },
            { matrix: [[1, 1], [1, 0]], colorId: 3 },
            { matrix: [[1, 1, 1], [0, 1, 0]], colorId: 4 },
            { matrix: [[1, 1], [1, 1], [1, 1]], colorId: 5 },
            { matrix: [[1]], colorId: 6 }
        ];

        function getRandomShape() {
            let filledCount = grid.flat().filter(v => v === 1).length;
            let filteredShapes = allShapes;
            if (filledCount > 32) filteredShapes = allShapes.filter(s => s.matrix.flat().reduce((a, b) => a + b, 0) <= 4);
            if (filledCount > 45) filteredShapes = allShapes.filter(s => s.matrix.flat().reduce((a, b) => a + b, 0) <= 3);
            if (filteredShapes.length === 0) filteredShapes = allShapes;
            return filteredShapes[Math.floor(Math.random() * filteredShapes.length)];
        }

        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.addEventListener('click', () => { if (hammerModeActive && grid[row][col] === 1) useHammer(row, col); });
                board.appendChild(cell);
            }
        }

        function drawCurrentShapes() {
            shapeContainer.innerHTML = ''; blocksUsed = 0;
            currentShapes.forEach((shapeObj, index) => {
                const shapeDiv = document.createElement('div');
                shapeDiv.classList.add('shape');
                shapeDiv.style.gridTemplateColumns = `repeat(${shapeObj.matrix[0].length}, 26px)`;
                shapeDiv.id = `shape-${index}`; 
                
                shapeDiv.addEventListener('pointerdown', (e) => {
                    if (hammerModeActive) return;
                    e.preventDefault();
                    activeShapeIndex = index;
                    activePointerId = e.pointerId;
                    shapeDiv.setPointerCapture(e.pointerId);
                    
                    const boardRect = board.getBoundingClientRect();
                    ghostCellSize = (boardRect.width - 12) / 8;
                    
                    const rect = shapeDiv.getBoundingClientRect();
                    const localX = e.clientX - rect.left;
                    const localY = e.clientY - rect.top;
                    const previewCellSize = rect.width / shapeObj.matrix[0].length;
                    const clickedCol = Math.floor(localX / previewCellSize);
                    const clickedRow = Math.floor(localY / previewCellSize);
                    
                    let found = false, minDist = 999;
                    for (let r = 0; r < shapeObj.matrix.length; r++) {
                        for (let c = 0; c < shapeObj.matrix[r].length; c++) {
                            if (shapeObj.matrix[r][c] === 1) {
                                let dist = Math.abs(r - clickedRow) + Math.abs(c - clickedCol);
                                if (!found || dist < minDist) { minDist = dist; grabOffsetRow = r; grabOffsetCol = c; found = true; }
                            }
                        }
                    }
                    
                    dragGhost.innerHTML = '';
                    shapeObj.matrix.forEach(row => {
                        row.forEach(val => {
                            const cell = document.createElement('div');
                            cell.style.width = ghostCellSize + 'px'; cell.style.height = ghostCellSize + 'px'; cell.style.borderRadius = '3px';
                            if (val === 1) { cell.style.backgroundColor = getCurrentColors()[shapeObj.colorId]; }
                            else { cell.style.backgroundColor = 'transparent'; }
                            dragGhost.appendChild(cell);
                        });
                    });
                    dragGhost.style.display = 'grid';
                    dragGhost.style.gridTemplateColumns = `repeat(${shapeObj.matrix[0].length}, ${ghostCellSize}px)`;
                    dragGhost.style.gap = '2px';
                    moveGhost(e.clientX, e.clientY);
                });

                shapeObj.matrix.forEach(row => row.forEach(val => {
                    const cell = document.createElement('div');
                    cell.classList.add('shape-cell', 'main');
                    if (val === 1) cell.style.backgroundColor = getCurrentColors()[shapeObj.colorId];
                    else cell.classList.add('empty');
                    shapeDiv.appendChild(cell);
                }));
                shapeContainer.appendChild(shapeDiv);
            });
        }

        function moveGhost(clientX, clientY) {
            let left = clientX - (grabOffsetCol * ghostCellSize + ghostCellSize / 2);
            let top = clientY - (grabOffsetRow * ghostCellSize + ghostCellSize / 2) - 30;
            dragGhost.style.left = left + 'px'; dragGhost.style.top = top + 'px';
        }

        function calculateTargetPosition() {
            const ghostRect = dragGhost.getBoundingClientRect();
            const boardRect = board.getBoundingClientRect();
            const shapeObj = currentShapes[activeShapeIndex];
            const ghostCellWidth = ghostRect.width / shapeObj.matrix[0].length;
            const ghostCellHeight = ghostRect.height / shapeObj.matrix.length;
            const ghostCenterX = ghostRect.left + (ghostCellWidth / 2);
            const ghostCenterY = ghostRect.top + (ghostCellHeight / 2);
            const boardStrideX = boardRect.width / 8;
            const boardStrideY = boardRect.height / 8;
            const targetCol = Math.round((ghostCenterX - boardRect.left) / boardStrideX);
            const targetRow = Math.round((ghostCenterY - boardRect.top) / boardStrideY);
            return { targetRow, targetCol };
        }

        function getClosestValidPosition(matrix, startRow, startCol) {
            let possibleOffsets = [];
            for (let r = -2; r <= 2; r++) {
                for (let c = -2; c <= 2; c++) { possibleOffsets.push({dr: r, dc: c, dist: r*r + c*c}); }
            }
            possibleOffsets.sort((a, b) => a.dist - b.dist);
            for (let offset of possibleOffsets) {
                if (canPlaceShapeAt(matrix, startRow + offset.dr, startCol + offset.dc)) {
                    return { targetRow: startRow + offset.dr, targetCol: startCol + offset.dc };
                }
            }
            return null;
        }

        function highlightBoard() {
            Array.from(board.children).forEach(c => c.classList.remove('hover', 'clear-preview'));
            const shapeObj = currentShapes[activeShapeIndex];
            const rawPos = calculateTargetPosition();
            const bestPos = getClosestValidPosition(shapeObj.matrix, rawPos.targetRow, rawPos.targetCol);
            
            if (bestPos) {
                let tempGrid = grid.map(r => [...r]);
                for (let r = 0; r < shapeObj.matrix.length; r++) {
                    for (let c = 0; c < shapeObj.matrix[r].length; c++) {
                        if (shapeObj.matrix[r][c] === 1) tempGrid[bestPos.targetRow + r][bestPos.targetCol + c] = 1;
                    }
                }
                let fullRows = [], fullCols = [];
                for (let r = 0; r < 8; r++) if (tempGrid[r].every(v => v === 1)) fullRows.push(r);
                for (let c = 0; c < 8; c++) if (tempGrid.every(row => row[c] === 1)) fullCols.push(c);

                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        let idx = r * 8 + c, isPartOfShape = false;
                        for (let sr = 0; sr < shapeObj.matrix.length; sr++) {
                            for (let sc = 0; sc < shapeObj.matrix[sr].length; sc++) {
                                if (shapeObj.matrix[sr][sc] === 1 && (bestPos.targetRow + sr === r) && (bestPos.targetCol + sc === c)) isPartOfShape = true;
                            }
                        }
                        if (isPartOfShape) board.children[idx].classList.add('hover');
                        if (fullRows.includes(r) || fullCols.includes(c)) board.children[idx].classList.add('clear-preview');
                    }
                }
            }
        }

        window.addEventListener('pointermove', (e) => {
            if (activeShapeIndex === null) return;
            moveGhost(e.clientX, e.clientY); highlightBoard();
        });

        window.addEventListener('pointerup', (e) => {
            if (activeShapeIndex === null) return;
            const shapeObj = currentShapes[activeShapeIndex];
            const rawPos = calculateTargetPosition();
            const bestPos = getClosestValidPosition(shapeObj.matrix, rawPos.targetRow, rawPos.targetCol);
            dragGhost.style.display = 'none';
            Array.from(board.children).forEach(c => c.classList.remove('hover', 'clear-preview'));
            if (bestPos) attemptPlacement(activeShapeIndex, bestPos.targetRow, bestPos.targetCol);
            activeShapeIndex = null;
        });

        function drawPreviewShapes() {
            previewContainer.innerHTML = ''; 
            nextShapes.forEach(shapeObj => {
                const shapeDiv = document.createElement('div');
                shapeDiv.classList.add('shape');
                shapeDiv.style.gridTemplateColumns = `repeat(${shapeObj.matrix[0].length}, 8px)`;
                shapeObj.matrix.forEach(row => row.forEach(val => {
                    const cell = document.createElement('div');
                    cell.classList.add('shape-cell', 'preview');
                    if (val === 1) cell.style.backgroundColor = getCurrentColors()[shapeObj.colorId];
                    else cell.classList.add('empty');
                    shapeDiv.appendChild(cell);
                }));
                previewContainer.appendChild(shapeDiv);
            });
        }

        function canPlaceShapeAt(matrix, startRow, startCol) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    if (matrix[r][c] === 1) {
                        let boardR = startRow + r, boardC = startCol + c;
                        if (boardR < 0 || boardR >= 8 || boardC < 0 || boardC >= 8) return false;
                        if (grid[boardR][boardC] === 1) return false;
                    }
                }
            }
            return true;
        }

        function saveStateForUndo() {
            moveHistory.push({
                grid: grid.map(r => [...r]), gridColors: gridColors.map(r => [...r]),
                score: score, blocksUsed: blocksUsed,
                currentShapes: JSON.parse(JSON.stringify(currentShapes)), nextShapes: JSON.parse(JSON.stringify(nextShapes))
            });
            if (moveHistory.length > 5) moveHistory.shift();
            document.getElementById('undo-btn').style.display = 'flex';
        }

        function undoMove() {
            if (moveHistory.length === 0 || gems < 2) { alert("Nicht genug Juwelen (2 💎 nötig)!"); return; }
            gems -= 2; updateGemUI(); showFloatingText("-2 💎");
            const lastState = moveHistory.pop();
            grid = lastState.grid; gridColors = lastState.gridColors; score = lastState.score;
            blocksUsed = lastState.blocksUsed; currentShapes = lastState.currentShapes; nextShapes = lastState.nextShapes;
            scoreElement.innerText = score;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let cell = board.children[r * 8 + c]; cell.className = 'cell';
                    if (grid[r][c] === 1) cell.classList.add(`filled-color-${gridColors[r][c]}`);
                }
            }
            drawCurrentShapes(); drawPreviewShapes(); deactivateHammer();
            if (moveHistory.length === 0) document.getElementById('undo-btn').style.display = 'none';
            playSound('hammer');
        }

        function attemptPlacement(shapeIndex, startRow, startCol) {
            const shapeObj = currentShapes[shapeIndex];
            if (canPlaceShapeAt(shapeObj.matrix, startRow, startCol)) {
                saveStateForUndo();
                let blocksToPlace = 0;
                for (let r = 0; r < shapeObj.matrix.length; r++) {
                    for (let c = 0; c < shapeObj.matrix[r].length; c++) {
                        if (shapeObj.matrix[r][c] === 1) {
                            let boardR = startRow + r, boardC = startCol + c;
                            grid[boardR][boardC] = 1; gridColors[boardR][boardC] = shapeObj.colorId;
                            let cell = board.children[boardR * 8 + boardC];
                            cell.className = 'cell'; cell.classList.add(`filled-color-${shapeObj.colorId}`);
                            blocksToPlace++;
                        }
                    }
                }
                let exploded = checkAndClearLines(); 
                if (!exploded) playSound('place');
                updateScore(blocksToPlace * 10);
                document.getElementById(`shape-${shapeIndex}`).style.visibility = 'hidden';
                blocksUsed++;
                checkTableClear();
                if (blocksUsed === 3) {
                    currentShapes = nextShapes; 
                    nextShapes = [getRandomShape(), getRandomShape(), getRandomShape()]; 
                    drawCurrentShapes(); drawPreviewShapes();
                }
                checkGameOver();
            }
        }

        function checkAndClearLines() {
            let rowsToClear = [], colsToClear = [];
            for (let r = 0; r < 8; r++) if (grid[r].every(v => v === 1)) rowsToClear.push(r);
            for (let c = 0; c < 8; c++) if (grid.every(row => row[c] === 1)) colsToClear.push(c);
            let linesCleared = rowsToClear.length + colsToClear.length;
            if (linesCleared > 0) {
                playSound('explode');
                let bonusPoints = (linesCleared * 100) * linesCleared;
                updateScore(bonusPoints);
                showFloatingText(`+${bonusPoints}`);
                if (linesCleared >= 2) {
                    boardWrapper.classList.add('shake');
                    setTimeout(() => boardWrapper.classList.remove('shake'), 300);
                }
                rowsToClear.forEach(r => { for (let c = 0; c < 8; c++) explodeCell(r, c, board.children[r * 8 + c]); });
                colsToClear.forEach(c => { for (let r = 0; r < 8; r++) explodeCell(r, c, board.children[r * 8 + c]); });
                return true;
            }
            return false;
        }

        function checkTableClear() {
            if (grid.every(row => row.every(v => v === 0))) {
                playSound('tableclear'); updateScore(5000); showFloatingText("+5.000 CLEAR!"); activateDoubleScore();
            }
        }

        function activateDoubleScore() {
            doubleScoreActive = true; secondsLeft = 60; doubleScoreBanner.style.display = 'block'; timerSecondsElement.innerText = secondsLeft;
            if (doubleScoreTimer) clearInterval(doubleScoreTimer);
            doubleScoreTimer = setInterval(() => {
                secondsLeft--; timerSecondsElement.innerText = secondsLeft;
                if (secondsLeft <= 0) { clearInterval(doubleScoreTimer); doubleScoreActive = false; doubleScoreBanner.style.display = 'none'; }
            }, 1000);
        }

        function explodeCell(r, c, cellHtml) {
            grid[r][c] = 0; gridColors[r][c] = -1; cellHtml.className = 'cell explosion';
            setTimeout(() => { cellHtml.className = 'cell'; }, 200);
        }

        function showFloatingText(text) {
            const div = document.createElement('div');
            div.classList.add('floating-text'); div.innerText = text;
            div.style.left = '45%'; div.style.top = '40%';
            boardWrapper.appendChild(div);
            setTimeout(() => div.remove(), 800);
        }

        function updateScore(pointsToAdd) {
            if (doubleScoreActive) pointsToAdd *= 2;
            let oldScore = score; score += pointsToAdd; scoreElement.innerText = score;
            let oldGems = Math.floor(oldScore / 1000), newGems = Math.floor(score / 1000);
            if (newGems > oldGems) { gems += (newGems - oldGems); updateGemUI(); showFloatingText(`+${newGems - oldGems} 💎`); }
        }

        function updateHammerUI() {
            if (hammersAvailable > 0) { hammerBtn.style.display = 'flex'; hammerCountElement.innerText = hammersAvailable; }
            else { hammerBtn.style.display = 'none'; }
        }

        function activateHammer() {
            if (hammersAvailable <= 0) return;
            hammerModeActive = !hammerModeActive;
            if (hammerModeActive) {
                hammerBtn.classList.add('active-hammer');
                for (let r = 0; r < 8; r++) { for (let c = 0; c < 8; c++) { if (grid[r][c] === 1) board.children[r * 8 + c].classList.add('hammer-target'); } }
            } else { deactivateHammer(); }
        }

        function deactivateHammer() {
            hammerModeActive = false; hammerBtn.classList.remove('active-hammer');
            Array.from(board.children).forEach(c => c.classList.remove('hammer-target'));
        }

        function useHammer(row, col) {
            playSound('hammer'); grid[row][col] = 0; gridColors[row][col] = -1;
            let cell = board.children[row * 8 + col]; cell.className = 'cell explosion';
            setTimeout(() => { cell.className = 'cell'; }, 200);
            hammersAvailable--; deactivateHammer(); updateHammerUI(); checkTableClear(); checkGameOver();
        }

        function checkGameOver() {
            if (hammerModeActive || hammersAvailable > 0) {
                if (grid.some(row => row.includes(1)) && hammersAvailable > 0) return; 
            }
            let canPlaceAny = false;
            for (let i = 0; i < 3; i++) {
                let shapeDiv = document.getElementById(`shape-${i}`);
                if (shapeDiv && shapeDiv.style.visibility !== 'hidden') {
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) { if (canPlaceShapeAt(currentShapes[i].matrix, r, c)) { canPlaceAny = true; break; } }
                        if (canPlaceAny) break;
                    }
                }
                if (canPlaceAny) break;
            }
            if (!canPlaceAny && hammersAvailable === 0) {
                playSound('gameover'); finalScoreElement.innerText = score; gameOverModal.style.display = 'flex';
                if (isNewHighscore(score)) { newHighscoreArea.style.display = 'flex'; standardButtons.style.display = 'none'; playerNameInput.focus(); }
                else { newHighscoreArea.style.display = 'none'; standardButtons.style.display = 'flex'; }
            }
        }

        function openMenu() {
            bgMenu.style.display = 'block'; bgGame.style.display = 'none'; gameContainer.style.display = 'none'; mainMenu.style.display = 'flex';
            if (doubleScoreTimer) clearInterval(doubleScoreTimer); doubleScoreActive = false; doubleScoreBanner.style.display = 'none';
            updateGemUI(); updateLeaderboardUI();
        }

        function openGame() {
            bgMenu.style.display = 'none'; bgGame.style.display = 'block'; mainMenu.style.display = 'none'; gameContainer.style.display = 'flex';
            restartGame();
        }

        function backToMenu() { gameOverModal.style.display = 'none'; deactivateHammer(); openMenu(); }

        function restartGame() {
            score = 0; scoreElement.innerText = score; hammersAvailable = 0; updateHammerUI(); deactivateHammer();
            if (doubleScoreTimer) clearInterval(doubleScoreTimer); doubleScoreActive = false; doubleScoreBanner.style.display = 'none';
            grid = Array(8).fill().map(() => Array(8).fill(0)); moveHistory = [];
            document.getElementById('undo-btn').style.display = 'none';
            gridColors = Array(8).fill().map(() => Array(8).fill(-1));
            Array.from(board.children).forEach(cell => { cell.className = 'cell'; });
            gameOverModal.style.display = 'none';
            currentShapes = [getRandomShape(), getRandomShape(), getRandomShape()];
            nextShapes = [getRandomShape(), getRandomShape(), getRandomShape()];
            drawCurrentShapes(); drawPreviewShapes();
        }

        function saveHighscore() {
            let name = playerNameInput.value.trim() || "Anonym";
            leaderboards.push({ name: name, score: score });
            leaderboards.sort((a, b) => b.score - a.score);
            if (leaderboards.length > MAX_HIGHSCORES) leaderboards.pop();
            localStorage.setItem('blockExplosionLeaderboard', JSON.stringify(leaderboards));
            playerNameInput.value = ''; gameOverModal.style.display = 'none'; openMenu();
        }

        window.giveGems = function(amount) { gems += amount; updateGemUI(); showFloatingText(`+${amount} 💎`); };

        updateGemUI(); updateLeaderboardUI();
    </script>

    <!-- SHOP MODAL -->
    <div id="shop-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200; justify-content:center; align-items:center; backdrop-filter:blur(5px);">
        <div style="background:rgba(20,20,20,0.95); padding:15px; border-radius:14px; width:90%; max-width:340px; border:2px solid rgba(255,255,255,0.2); text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.8);">
            <h2 style="color:#ff9800; margin:0 0 5px 0; font-size:20px;">💎 Juwelen-Shop</h2>
            <p style="color:#aaa; font-size:11px; margin:0 0 10px 0;">Erhalte 1 Juwel pro 1.000 Punkte!</p>
            <p style="color:#00bcd4; font-weight:bold; font-size:13px; margin-bottom:10px;">Verfügbar: <span id="shop-gem-count">0</span> 💎</p>
            
            <div id="shop-items-container" style="display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; margin-bottom:12px; text-align:left;">
            </div>
            
            <button class="btn" onclick="closeShop()" style="background-color:#666; margin:0; padding:6px;">Schließen</button>
        </div>
    </div>
